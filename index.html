<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{font-family:system-ui,'Noto Sans Tamil',sans-serif;color:#172849;background:#edf2f8}*{box-sizing:border-box}body{margin:0;padding:18px}.wrap{max-width:740px;margin:auto}.hero{background:linear-gradient(130deg,#0c2147,#183f74);color:white;padding:30px;border-radius:18px 18px 0 0;text-align:center}.hero h1{font-size:32px;color:#e8c77c;margin:6px 0}.hero p{margin:8px 0}.content{background:white;padding:24px;border-radius:0 0 18px 18px;box-shadow:0 12px 30px #10264b15}.q{padding:18px 0;border-bottom:1px solid #e6eaf0}.q label.heading{font-weight:700;display:block;margin-bottom:10px}.hint{font-size:13px;color:#596b83;margin-top:4px}.options{display:flex;flex-wrap:wrap;gap:9px}.options label{border:1px solid #ccd6e4;border-radius:10px;padding:10px 13px;cursor:pointer}.options label:has(input:checked){border-color:#bd8b2d;background:#fff7e7}input[type=text],select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:12px;font:inherit}textarea{min-height:85px}button{width:100%;border:0;border-radius:12px;background:#bd8b2d;color:#101d36;padding:15px;font-size:17px;font-weight:750;cursor:pointer;margin-top:20px}button:disabled{opacity:.55;cursor:wait}.status{margin-top:15px;text-align:center;font-weight:600}.success{color:#136b39}.error{color:#ad2525}.required{color:#ad2525}.footer{text-align:center;font-size:12px;color:#62728b;padding:15px}@media(max-width:500px){.content{padding:17px}.hero{padding:22px 12px}.options{flex-direction:column}.options label{width:100%}}
</style></head><body><div class="wrap"><header class="hero"><div>SOMASUNDARAM NT SKILLS ACADEMY</div><h1>YES, I CAN!</h1><p>From Exam Fear to Exam Confidence</p><p>Student Feedback | மாணவர் கருத்துப் படிவம்</p></header><main class="content"><form id="form">
<div class="q"><label class="heading" for="language">Language / மொழி</label><select id="language" name="language"><option value="English">English</option><option value="Tamil">தமிழ்</option></select></div>
<div class="q"><label class="heading" for="name" data-en="Student name (optional)" data-ta="மாணவர் பெயர் (விருப்பம்)">Student name (optional)</label><input type="text" id="name" name="name" maxlength="100" placeholder="Optional"></div>
<div class="q"><label class="heading" for="studentClass" data-en="Class (optional)" data-ta="வகுப்பு (விருப்பம்)">Class (optional)</label><select id="studentClass" name="studentClass"><option value="">Prefer not to say</option><option>10</option><option>11</option><option>12</option><option>Other</option></select></div>
<div id="questions"></div><button id="submit" type="submit">Submit Feedback / கருத்தைப் பதிவு செய்க</button><div id="status" class="status" role="status" aria-live="polite"></div></form></main><div class="footer">N T SOMASUNDARAM · Certified Master Trainer<br>Responses are used to improve training. Please do not include sensitive personal information.</div></div>
<script>
const questions=[
{name:'overall',en:'1. How would you rate this workshop?',ta:'1. இந்தப் பயிற்சியை எவ்வாறு மதிப்பிடுகிறீர்கள்?',values:['1','2','3','4','5'],hint:'1 = Low · 5 = Excellent'},
{name:'before',en:'2. How confident were you about exams BEFORE the session?',ta:'2. பயிற்சிக்கு முன்பு தேர்வு குறித்த உங்கள் தன்னம்பிக்கை எவ்வளவு?',values:['1','2','3','4','5'],hint:'1 = Very low · 5 = Very high'},
{name:'after',en:'3. How confident do you feel about exams AFTER the session?',ta:'3. பயிற்சிக்குப் பிறகு தேர்வு குறித்த உங்கள் தன்னம்பிக்கை எவ்வளவு?',values:['1','2','3','4','5'],hint:'1 = Very low · 5 = Very high'},
{name:'topic',en:'4. Which topic helped you most?',ta:'4. எந்தப் பகுதி உங்களுக்கு மிகவும் பயனுள்ளதாக இருந்தது?',values:['Understanding Exam Fear','Building Confidence','Focus & Distractions','Good Study Habits','Control What You Can','24-Hour Action Challenge']},
{name:'clarity',en:'5. How clear was the trainer’s explanation?',ta:'5. பயிற்சியாளரின் விளக்கம் எவ்வளவு தெளிவாக இருந்தது?',values:['1','2','3','4','5'],hint:'1 = Not clear · 5 = Very clear'},
{name:'engagement',en:'6. How engaging were the activities?',ta:'6. செயல்பாடுகள் உங்களை எந்த அளவுக்கு ஈடுபடுத்தின?',values:['1','2','3','4','5'],hint:'1 = Not engaging · 5 = Very engaging'},
{name:'action',en:'7. What is ONE action you will take within 24 hours?',ta:'7. அடுத்த 24 மணி நேரத்திற்குள் நீங்கள் செய்யப்போகும் ஒரு செயல் என்ன?',type:'textarea'}
];
let submissionId = (crypto.randomUUID ? crypto.randomUUID() : Date.now()+'-'+Math.random());
const qbox=document.getElementById('questions');
function render(){const tamil=document.getElementById('language').value==='Tamil';document.querySelectorAll('[data-en]').forEach(el=>el.textContent=el.dataset[tamil?'ta':'en']);qbox.innerHTML=questions.map(q=>`<div class="q"><label class="heading" ${q.type==='textarea'?'for="'+q.name+'"':''}>${tamil?q.ta:q.en} <span class="required">*</span></label>${q.type==='textarea'?`<textarea id="${q.name}" name="${q.name}" required maxlength="1000"></textarea>`:`<div class="options">${q.values.map((v,i)=>`<label><input type="radio" name="${q.name}" value="${v}" required> ${v}</label>`).join('')}</div>${q.hint?`<div class="hint">${q.hint}</div>`:''}`}</div>`).join('');}
document.getElementById('language').addEventListener('change',render);render();
const ENDPOINT = "https://script.google.com/macros/s/AKfycbwUZWOr6hkTLCfsB7LQdiXgdhOPlknPvVpB4i8tavRG8ZkBf3jj0HtHm1GwZHHE1aIIwQ/exec";
document.getElementById('form').addEventListener('submit', async function(e){
 e.preventDefault(); if(!this.reportValidity()) return;
 const btn=document.getElementById('submit'),status=document.getElementById('status');
 btn.disabled=true;status.className='status';status.textContent='Sending feedback…';
 const data=Object.fromEntries(new FormData(this).entries());data.submissionId=submissionId;
 try {
   // A simple POST avoids CORS preflight. Apps Script redirects cannot be read by a GitHub page.
   // no-cors means delivery cannot be verified in the browser; check Google Sheets.
   await fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(data)});
   status.className='status';
   status.textContent='Feedback sent. Please confirm it appears in Google Sheets. / கருத்து அனுப்பப்பட்டது.';
   btn.textContent='Sent';
 } catch(err) {
   status.className='status error';status.textContent='Network error. Please retry.';
   btn.disabled=false;
 }
});
</script></body></html>
