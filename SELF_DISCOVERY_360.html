<!doctype html><html lang="ta"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SELF DISCOVERY 360 V6 | SOMASUNDARAM NT SKILLS ACADEMY</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap');
:root{--navy:#10244c;--blue:#2252aa;--ink:#18294a;--muted:#64748b;--gold:#f4bc52;--line:#e3eaf4;--paper:#fff;--bg:#f5f8ff}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at 8% 15%,#e9f3ff 0,transparent 40%),radial-gradient(ellipse at 92% 38%,#fff0e4 0,transparent 35%),#f5f8ff;color:var(--ink);font:15.5px/1.75 'DM Sans','Noto Sans Tamil',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
header{position:relative;overflow:hidden;background:linear-gradient(115deg,#0c2149 0%,#17457c 56%,#3859ad 100%);color:#fff;padding:34px max(20px,calc((100% - 1120px)/2)) 40px;isolation:isolate;border-bottom:4px solid #eebc63}
header:before,header:after{content:"";position:absolute;z-index:-1;border:1px solid #ffffff25;border-radius:50%}header:before{width:340px;height:340px;right:-50px;top:-180px;background:radial-gradient(circle,#ffffff12,transparent 70%)}header:after{width:180px;height:180px;right:210px;bottom:-135px;background:#ffffff0b}
header small{display:inline-flex;align-items:center;gap:7px;color:#ffdb8b;font-size:.78rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}header small:before{content:'✦';font-size:1rem;color:#ffd275}header h1{font-size:clamp(2rem,4.5vw,3.1rem);line-height:1.2;letter-spacing:-.04em;margin:9px 0 6px;font-weight:800;color:#fff}header div{color:#e4edff;font-size:.99rem}
main{max-width:1120px;margin:auto;padding:20px 20px 60px}main>nav:first-child{margin:0 0 24px;padding:10px;background:#ffffffd9;border:1px solid #e2eafa;border-radius:16px;box-shadow:0 6px 25px #15336309;position:relative}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:25px;margin:16px 0;box-shadow:0 8px 30px #1533630c;position:relative}h1{font-size:1.65rem;margin:5px 0}h2{font-size:clamp(1.12rem,2.4vw,1.36rem);line-height:1.45;margin:0 0 12px;color:#172d54;font-weight:800;letter-spacing:-.015em}h3{color:#244674}p{margin:9px 0 15px}
button,.btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;background:linear-gradient(125deg,#19458d,#2862bd);color:white;border:0;border-radius:12px;padding:11px 19px;cursor:pointer;font:700 .91rem/1.5 'DM Sans','Noto Sans Tamil',system-ui,sans-serif;box-shadow:0 5px 12px #2352a122;transition:transform .15s,box-shadow .15s,filter .15s}button:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 9px 19px #2352a12b;filter:brightness(1.04)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #f4bb52;outline-offset:2px}button.secondary{background:#edf3fc;color:#1c498d;box-shadow:none;border:1px solid #dae6f7}button:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}input,select,textarea{font:inherit;padding:12px 14px;border:1px solid #cad6e8;border-radius:11px;max-width:100%;width:100%;background:#fff;color:var(--ink)}textarea{min-height:130px}input[type=checkbox],input[type=radio]{accent-color:#2252aa;min-width:17px;min-height:17px}label{display:block;margin:13px 0;font-weight:500}label input:not([type=checkbox]):not([type=radio]),label select{margin-top:6px}nav{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:17px;margin:18px 0}.grid>.card{margin:0;display:flex;flex-direction:column;min-height:238px;border-top:5px solid var(--accent,#4189d6);transition:transform .2s,box-shadow .2s}.grid>.card:hover{transform:translateY(-3px);box-shadow:0 15px 35px #17386a1b}.grid>.card:nth-child(7n+1){--accent:#5a6fe6;--pale:#edf0ff}.grid>.card:nth-child(7n+2){--accent:#e59a3c;--pale:#fff4e4}.grid>.card:nth-child(7n+3){--accent:#e36a8b;--pale:#fff0f5}.grid>.card:nth-child(7n+4){--accent:#9a6bda;--pale:#f5edff}.grid>.card:nth-child(7n+5){--accent:#20a6a1;--pale:#e8f9f6}.grid>.card:nth-child(7n+6){--accent:#448bcf;--pale:#e9f4ff}.grid>.card:nth-child(7n+7){--accent:#6ca348;--pale:#eff8e8}.grid>.card .tag{background:var(--pale,#e8eff9);color:var(--accent,#173b67);align-self:flex-start}.grid>.card h2{margin:15px 0 8px}.grid>.card nav{margin-top:auto;padding-top:15px}.grid>.card .progress>div{background:var(--accent,#b88b35)}
.muted{color:#65758d;font-size:.92rem}.progress{background:#eaf0f8;height:11px;border-radius:20px;overflow:hidden;margin:12px 0}.progress>div{background:linear-gradient(90deg,#e9a647,#f5d279);height:100%;border-radius:20px;transition:width .25s}.options{display:grid;gap:11px;margin:18px 0}.option{display:flex;align-items:center;gap:13px;border:1px solid #d9e3f0;padding:14px 16px;border-radius:14px;cursor:pointer;background:#fff;transition:background .15s,border-color .15s}.option:hover{background:#f4f8ff;border-color:#8eb0e5}.option input{width:auto;flex-shrink:0}.option:has(input:checked){border:2px solid #3163b4;background:#edf4ff;padding:13px 15px;box-shadow:0 4px 15px #2352a10e}.flex{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.tag{display:inline-block;background:#e9f1ff;color:#1c5299;border-radius:50px;padding:5px 12px;font-size:.76rem;font-weight:800;letter-spacing:.02em}.bar{height:13px;background:#e9eef7;border-radius:20px;overflow:hidden}.bar>div{height:100%;background:linear-gradient(90deg,#4168c8,#3db7ad);border-radius:20px}.stat{padding:16px;border:1px solid #e1eaf5;border-left:4px solid #5b83d6;background:#f9fbff;border-radius:12px;margin:12px 0}footer{text-align:center;padding:24px;color:#64758e;font-size:.85rem;background:#eef3fb;border-top:1px solid #e1e8f4}a{color:#2458a4}#ai-prompt-panel{border:1px solid #cfdcf4;background:linear-gradient(150deg,#fff,#f3f7ff)}#ai-prompt-panel h2:before{content:'✦ ';color:#d6a144}#ai-prompt-panel textarea{background:#fff;font-size:.85rem;line-height:1.55}
@media(max-width:600px){header{padding:26px 17px 32px}header h1{font-size:2.05rem}main{padding:14px 13px 42px}.card{padding:19px 16px;border-radius:18px}.grid{grid-template-columns:1fr;gap:13px}.grid>.card{min-height:unset}main>nav:first-child{padding:8px}nav button{font-size:.82rem;padding:10px 12px}.flex{align-items:flex-start}.option{padding:12px}button{min-height:43px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media print{header,nav,.no-print,footer{display:none!important}body{background:#fff;color:#111}main{max-width:100%;padding:0}.card{box-shadow:none;break-inside:avoid;border:1px solid #ddd}button{display:none}.grid>.card{break-inside:avoid}h2{color:#111}}

.english-help{display:block;font-family:'DM Sans',system-ui,sans-serif;font-size:.78em;font-weight:500;line-height:1.5;color:#55739c;margin-top:5px;letter-spacing:.01em}
.question-heading .english-help{font-size:.68em;line-height:1.6;margin-top:12px;padding:10px 13px;background:#eef5ff;border-left:3px solid #4e87d8;border-radius:8px;color:#315b90}
.tag .english-help{font-size:11px;color:#466b9c}.english-inline{color:#59749a;font-size:.91em}
@media print{.question-heading .english-help{background:none;border-left:0;padding:0}}

.academy-header{display:flex;align-items:center;gap:26px;max-width:1120px;margin:auto;position:relative;z-index:1}.academy-logo{display:block;width:clamp(135px,23vw,245px);height:auto;max-height:175px;object-fit:contain;flex-shrink:0;filter:drop-shadow(0 5px 12px #0004)}.academy-heading{min-width:0}.academy-heading p{color:#e4edff;margin:8px 0 0;font-size:1rem}.academy-heading small{letter-spacing:.08em}@media(max-width:620px){header{padding-top:22px;padding-bottom:26px}.academy-header{flex-direction:column;text-align:center;gap:9px}.academy-logo{width:175px;max-height:135px}.academy-heading h1{font-size:clamp(1.8rem,8vw,2.5rem)}.academy-heading small{justify-content:center;font-size:.7rem;letter-spacing:.04em}}@media print{.academy-logo{width:110px;max-height:90px}.academy-header{flex-direction:row;text-align:left;gap:15px}}
</style></head><body><div id="app"></div><script>const DATA=[{"id":"interests","en":"Hidden Interests","ta":"மறைந்திருக்கும் ஆர்வங்கள்","facets":[{"id":"teaching","en":"Explaining & teaching","ta":"விளக்குவதும் கற்பிப்பதும்"},{"id":"analysis","en":"Investigation & analysis","ta":"ஆராய்ச்சியும் பகுப்பாய்வும்"},{"id":"creative","en":"Creating & designing","ta":"புதுமையும் வடிவமைப்பும்"},{"id":"service","en":"Helping people","ta":"மற்றவர்களுக்கு உதவுவதும்"},{"id":"organizing","en":"Planning & organizing","ta":"திட்டமிடலும் ஒருங்கிணைப்பும்"},{"id":"hands","en":"Practical making","ta":"செய்து பார்த்துக் கற்றலும்"}],"questions":[{"id":"interests-01","en":"When someone struggles to understand a topic, I would enjoy finding a simple way to explain it.","ta":"ஒருவருக்கு ஒரு விஷயம் புரியாமல் இருந்தால், அதை எளிதாக விளக்கும் வழியைத் தேடுவது எனக்குப் பிடிக்கும்.","facet":"teaching"},{"id":"interests-02","en":"I would willingly explore why a familiar problem keeps happening.","ta":"அடிக்கடி ஏற்படும் ஒரு பிரச்சினைக்கான காரணத்தை ஆராய விரும்புவேன்.","facet":"analysis"},{"id":"interests-03","en":"Given free time, I would like to create something original.","ta":"ஓய்வு நேரத்தில் புதிதாக ஏதாவது உருவாக்க விரும்புவேன்.","facet":"creative"},{"id":"interests-04","en":"I am drawn to activities that make another person’s day easier.","ta":"மற்றொருவரின் நாளை எளிதாக்கும் செயல்களில் எனக்கு ஆர்வம் உண்டு.","facet":"service"},{"id":"interests-05","en":"I enjoy turning a confusing event into a clear plan.","ta":"குழப்பமான நிகழ்வைத் தெளிவான திட்டமாக மாற்றுவது எனக்குப் பிடிக்கும்.","facet":"organizing"},{"id":"interests-06","en":"I would rather learn a new task by trying it with my hands.","ta":"புதிய வேலையை நேரில் செய்து பார்த்துக் கற்க விரும்புவேன்.","facet":"hands"},{"id":"interests-07","en":"I would volunteer to show a beginner how to complete a task.","ta":"புதியவருக்கு ஒரு வேலையைச் செய்வது எப்படி என்று காட்ட முன்வருவேன்.","facet":"teaching"},{"id":"interests-08","en":"I enjoy comparing different explanations before making up my mind.","ta":"ஒரு முடிவுக்கு வருவதற்கு முன் பல விளக்கங்களை ஒப்பிட்டுப் பார்ப்பது எனக்குப் பிடிக்கும்.","facet":"analysis"},{"id":"interests-09","en":"I notice colours, layouts or stories and imagine how to improve them.","ta":"நிறங்கள், வடிவமைப்புகள், கதைகளைப் பார்த்து அவற்றை மேம்படுத்தும் வழிகளை நினைப்பேன்.","facet":"creative"},{"id":"interests-10","en":"I would enjoy listening to people describe a challenge they face.","ta":"மற்றவர்கள் சந்திக்கும் சவால்களைக் கேட்டு அறிய விரும்புவேன்.","facet":"service"},{"id":"interests-11","en":"I like deciding the order in which a group should complete tasks.","ta":"ஒரு குழு வேலைகளை எந்த வரிசையில் செய்ய வேண்டும் என்று திட்டமிட விரும்புவேன்.","facet":"organizing"},{"id":"interests-12","en":"I would enjoy repairing or assembling a simple object.","ta":"ஒரு பொருளைப் பழுதுபார்ப்பதோ சேர்த்தமைப்பதோ எனக்குப் பிடிக்கும்.","facet":"hands"},{"id":"interests-13","en":"I seek opportunities to make complicated information understandable.","ta":"சிக்கலான தகவலைப் புரியும்படி மாற்ற வாய்ப்புகளைத் தேடுவேன்.","facet":"teaching"},{"id":"interests-14","en":"I am curious about patterns in numbers, events or people’s behaviour.","ta":"எண்கள், நிகழ்வுகள், மனிதர்களின் நடத்தை ஆகியவற்றில் உள்ள ஒற்றுமைகளை அறிய ஆர்வமாக இருப்பேன்.","facet":"analysis"},{"id":"interests-15","en":"I would choose an activity where I can experiment with fresh ideas.","ta":"புதிய யோசனைகளைச் சோதிக்க முடியும் செயல்பாட்டைத் தேர்ந்தெடுப்பேன்.","facet":"creative"},{"id":"interests-16","en":"I would enjoy guiding someone through an unfamiliar experience.","ta":"புதிய அனுபவத்தில் ஒருவருக்கு வழிகாட்டுவது எனக்குப் பிடிக்கும்.","facet":"service"},{"id":"interests-17","en":"I like arranging materials and schedules so work runs smoothly.","ta":"வேலை சீராக நடக்கப் பொருட்களையும் நேரத்தையும் ஒழுங்குபடுத்த விரும்புவேன்.","facet":"organizing"},{"id":"interests-18","en":"I would be interested in learning a hands-on craft or technique.","ta":"கைகளால் செய்யும் ஒரு கலை அல்லது தொழில்நுட்பத்தை கற்க ஆர்வமாக இருப்பேன்.","facet":"hands"}]},{"id":"strengths","en":"Personal Strengths","ta":"என்னுடைய பலங்கள்","facets":[{"id":"empathy","en":"Empathy","ta":"பிறரைப் புரிந்துகொள்ளுதல்"},{"id":"persistence","en":"Persistence","ta":"விடாமுயற்சி"},{"id":"reasoning","en":"Reasoning","ta":"சிந்தித்துத் தீர்வு காணுதல்"},{"id":"reliability","en":"Reliability","ta":"பொறுப்புணர்வு"},{"id":"adaptability","en":"Adaptability","ta":"சூழலுக்கேற்ப மாறுதல்"},{"id":"initiative","en":"Initiative","ta":"முன்வந்து செயல்படுதல்"}],"questions":[{"id":"strengths-01","en":"When someone is upset, I usually listen before giving advice.","ta":"ஒருவர் வருத்தத்தில் இருக்கும்போது அறிவுரை சொல்வதற்கு முன் கவனமாகக் கேட்பேன்.","facet":"empathy"},{"id":"strengths-02","en":"I return to an important task after an unsuccessful attempt.","ta":"முக்கியமான முயற்சி தோல்வியடைந்தாலும் மீண்டும் முயல்வேன்.","facet":"persistence"},{"id":"strengths-03","en":"Before choosing a solution, I consider more than one possible cause.","ta":"தீர்வைத் தேர்ந்தெடுப்பதற்கு முன் பல காரணங்களைச் சிந்திப்பேன்.","facet":"reasoning"},{"id":"strengths-04","en":"People can usually depend on me to complete what I promised.","ta":"நான் சொன்ன வேலையை முடிப்பேன் என்று மற்றவர்கள் நம்பலாம்.","facet":"reliability"},{"id":"strengths-05","en":"When plans change unexpectedly, I can adjust my approach.","ta":"திட்டம் திடீரென மாறினால் என் அணுகுமுறையை மாற்றிக்கொள்வேன்.","facet":"adaptability"},{"id":"strengths-06","en":"When I see an unattended task, I sometimes take the first step.","ta":"கவனிக்கப்படாத வேலை தெரிந்தால் சில நேரங்களில் நானே தொடங்குவேன்.","facet":"initiative"},{"id":"strengths-07","en":"I try to understand another person’s perspective during disagreements.","ta":"கருத்து வேறுபாட்டில் மற்றவரின் பார்வையையும் புரிந்துகொள்ள முயல்வேன்.","facet":"empathy"},{"id":"strengths-08","en":"I keep working on a difficult skill even when progress is slow.","ta":"முன்னேற்றம் மெதுவாக இருந்தாலும் கடினமான திறனைப் பயிற்சி செய்வேன்.","facet":"persistence"},{"id":"strengths-09","en":"I ask what evidence supports a claim before accepting it.","ta":"ஒரு கருத்தை ஏற்கும் முன் அதற்கான ஆதாரத்தைப் பார்ப்பேன்.","facet":"reasoning"},{"id":"strengths-10","en":"I follow through on responsibilities even when no one reminds me.","ta":"யாரும் நினைவூட்டாவிட்டாலும் பொறுப்புகளை நிறைவேற்றுவேன்.","facet":"reliability"},{"id":"strengths-11","en":"I can try an alternative method when the first one fails.","ta":"முதல் வழி பலனளிக்காவிட்டால் வேறு வழியை முயல்வேன்.","facet":"adaptability"},{"id":"strengths-12","en":"I suggest practical next steps instead of waiting indefinitely.","ta":"நீண்ட நேரம் காத்திருக்காமல் நடைமுறை அடுத்த படியை முன்மொழிவேன்.","facet":"initiative"},{"id":"strengths-13","en":"I notice when someone in a group is being left out.","ta":"குழுவில் ஒருவர் ஒதுக்கப்படுவதை கவனிப்பேன்.","facet":"empathy"},{"id":"strengths-14","en":"I can finish small steps of a long project over several days.","ta":"நீண்ட வேலையின் சிறிய பகுதிகளைப் பல நாட்கள் தொடர்ந்து முடிப்பேன்.","facet":"persistence"},{"id":"strengths-15","en":"I separate what I know from what I am assuming.","ta":"எனக்குத் தெரிந்த உண்மையையும் நான் ஊகிப்பதையும் பிரித்துப் பார்ப்பேன்.","facet":"reasoning"},{"id":"strengths-16","en":"I check my work for mistakes before handing it over.","ta":"வேலையை ஒப்படைக்கும் முன் பிழைகளைச் சரிபார்ப்பேன்.","facet":"reliability"},{"id":"strengths-17","en":"I stay open to learning when someone challenges my usual method.","ta":"என் வழக்கமான முறையை ஒருவர் கேள்வி கேட்டாலும் கற்றுக்கொள்ளத் தயாராக இருப்பேன்.","facet":"adaptability"},{"id":"strengths-18","en":"I can begin a useful conversation or task without being asked.","ta":"யாரும் சொல்லாமலேயே பயனுள்ள உரையாடலையோ வேலையையோ தொடங்குவேன்.","facet":"initiative"}]},{"id":"passion","en":"Passion & Motivation","ta":"ஆர்வமும் உள்ளார்ந்த உந்துதலும்","facets":[{"id":"curiosity","en":"Curiosity","ta":"அறியும் ஆர்வம்"},{"id":"meaning","en":"Meaning","ta":"அர்த்தமுள்ள பணி"},{"id":"mastery","en":"Mastery","ta":"திறமையை மேம்படுத்துதல்"},{"id":"impact","en":"Impact","ta":"பயனுள்ள மாற்றம்"},{"id":"energy","en":"Sustained engagement","ta":"தொடர்ந்து ஈடுபடுதல்"},{"id":"autonomy","en":"Autonomy","ta":"சுயமாகச் செயல்படுதல்"}],"questions":[{"id":"passion-01","en":"I willingly read or ask questions about subjects that intrigue me.","ta":"எனக்கு ஆர்வமுள்ள விஷயங்களைப் பற்றி தானாகவே படிப்பேன் அல்லது கேள்விகள் கேட்பேன்.","facet":"curiosity"},{"id":"passion-02","en":"I feel motivated when an activity serves a purpose I care about.","ta":"எனக்கு முக்கியமான நோக்கத்திற்காகச் செயல்படும்போது உற்சாகம் கிடைக்கிறது.","facet":"meaning"},{"id":"passion-03","en":"Improving at something I enjoy feels rewarding in itself.","ta":"பிடித்த செயலில் முன்னேறுவதே எனக்கு மகிழ்ச்சி தருகிறது.","facet":"mastery"},{"id":"passion-04","en":"I am energized when my effort makes a useful difference.","ta":"என் முயற்சி பயனுள்ள மாற்றத்தை ஏற்படுத்தும்போது உற்சாகமடைகிறேன்.","facet":"impact"},{"id":"passion-05","en":"I can stay engaged with a chosen activity even after its novelty fades.","ta":"புதுமை குறைந்த பிறகும் தேர்ந்தெடுத்த செயலில் தொடர்ந்து ஈடுபடுவேன்.","facet":"energy"},{"id":"passion-06","en":"I feel engaged when I can choose how to approach a task.","ta":"ஒரு வேலையை எப்படி செய்வது என்பதைத் தேர்வு செய்ய முடிந்தால் ஈடுபாடு அதிகரிக்கிறது.","facet":"autonomy"},{"id":"passion-07","en":"I seek answers beyond what is required for a task.","ta":"வேலைக்குத் தேவையான அளவைத் தாண்டியும் பதில்களைத் தேடுவேன்.","facet":"curiosity"},{"id":"passion-08","en":"A meaningful goal helps me continue through routine work.","ta":"அர்த்தமுள்ள இலக்கு இருந்தால் வழக்கமான வேலையையும் தொடர முடிகிறது.","facet":"meaning"},{"id":"passion-09","en":"I enjoy noticing small improvements in my abilities.","ta":"என் திறனில் ஏற்படும் சிறிய முன்னேற்றங்களையும் ரசிப்பேன்.","facet":"mastery"},{"id":"passion-10","en":"I would invest time in an activity that benefits others.","ta":"மற்றவர்களுக்கு பயனளிக்கும் செயலுக்கு நேரம் ஒதுக்க விரும்புவேன்.","facet":"impact"},{"id":"passion-11","en":"I revisit an interesting activity without external reminders.","ta":"ஆர்வமுள்ள செயலை யாரும் நினைவூட்டாமல் மீண்டும் செய்வேன்.","facet":"energy"},{"id":"passion-12","en":"Having room to make decisions increases my motivation.","ta":"முடிவெடுக்கச் சுதந்திரம் கிடைத்தால் என் ஆர்வம் அதிகரிக்கும்.","facet":"autonomy"},{"id":"passion-13","en":"I enjoy learning the background behind a topic that catches my attention.","ta":"கவனத்தை ஈர்த்த தலைப்பின் பின்னணியை அறிய விரும்புவேன்.","facet":"curiosity"},{"id":"passion-14","en":"I find it satisfying to connect daily work with a larger purpose.","ta":"அன்றாட வேலையை ஒரு பெரிய நோக்கத்துடன் இணைத்துப் பார்ப்பது திருப்தி தருகிறது.","facet":"meaning"},{"id":"passion-15","en":"I am willing to practise repeatedly to become better at something meaningful.","ta":"அர்த்தமுள்ள செயலில் சிறந்து விளங்க மீண்டும் மீண்டும் பயிற்சி செய்யத் தயாராக இருப்பேன்.","facet":"mastery"},{"id":"passion-16","en":"I feel fulfilled when I see a concrete benefit from my effort.","ta":"என் முயற்சியின் பயனை நேரில் காணும்போது நிறைவு கிடைக்கிறது.","facet":"impact"}]},{"id":"values","en":"Core Values","ta":"முக்கிய வாழ்க்கை மதிப்புகள்","facets":[{"id":"family","en":"Family & relationships","ta":"குடும்பமும் உறவுகளும்"},{"id":"security","en":"Stability & security","ta":"நிலைத்தன்மையும் பாதுகாப்பும்"},{"id":"freedom","en":"Freedom","ta":"சுதந்திரம்"},{"id":"service","en":"Contribution","ta":"சமூகப் பங்களிப்பு"},{"id":"achievement","en":"Achievement","ta":"சாதனை"},{"id":"integrity","en":"Integrity","ta":"நேர்மை"}],"questions":[{"id":"values-01","en":"I would give up some convenience to spend meaningful time with loved ones.","ta":"அன்புக்குரியவர்களுடன் நேரம் செலவிட சில வசதிகளை விட்டுக்கொடுக்கத் தயாராக இருப்பேன்.","facet":"family"},{"id":"values-02","en":"Predictable income and a stable routine matter in major decisions.","ta":"முக்கிய முடிவுகளில் நிலையான வருமானமும் ஒழுங்கான வாழ்க்கையும் எனக்கு முக்கியம்.","facet":"security"},{"id":"values-03","en":"Having the freedom to make my own choices matters greatly to me.","ta":"என் முடிவுகளை நானே எடுக்கும் சுதந்திரம் எனக்கு மிகவும் முக்கியம்.","facet":"freedom"},{"id":"values-04","en":"I prefer opportunities that let me contribute to others’ wellbeing.","ta":"மற்றவர்களின் நலனுக்குப் பங்களிக்க முடியும் வாய்ப்புகளை விரும்புவேன்.","facet":"service"},{"id":"values-05","en":"I value opportunities to achieve challenging personal goals.","ta":"சவாலான தனிப்பட்ட இலக்குகளை அடையும் வாய்ப்புகளை மதிக்கிறேன்.","facet":"achievement"},{"id":"values-06","en":"I would rather be truthful than gain an unfair advantage.","ta":"நியாயமற்ற நன்மையைப் பெறுவதைவிட உண்மையாக இருப்பதையே தேர்ந்தெடுப்பேன்.","facet":"integrity"},{"id":"values-07","en":"Maintaining close relationships influences my long-term plans.","ta":"நெருக்கமான உறவுகளைப் பேணுவது என் நீண்டகாலத் திட்டங்களில் முக்கியம்.","facet":"family"},{"id":"values-08","en":"I feel more comfortable with dependable arrangements than uncertain rewards.","ta":"நிச்சயமற்ற பலனைவிட நம்பகமான ஏற்பாடுகள் எனக்கு ஏற்றதாக இருக்கும்.","facet":"security"},{"id":"values-09","en":"I value being able to decide when and how I work.","ta":"எப்போது, எப்படி வேலை செய்வது என்பதை முடிவு செய்யும் உரிமையை மதிக்கிறேன்.","facet":"freedom"},{"id":"values-10","en":"Helping my community is an important part of a satisfying life.","ta":"சமூகத்திற்கு உதவுவது நிறைவான வாழ்க்கையின் முக்கிய பகுதி என நினைக்கிறேன்.","facet":"service"},{"id":"values-11","en":"I enjoy setting ambitious targets for myself.","ta":"எனக்காக உயர்ந்த இலக்குகளை நிர்ணயிப்பது எனக்குப் பிடிக்கும்.","facet":"achievement"},{"id":"values-12","en":"I want my actions to match my principles, even when inconvenient.","ta":"சிரமம் இருந்தாலும் என் செயல்கள் என் கொள்கைகளுக்கு ஏற்ப இருக்க வேண்டும்.","facet":"integrity"},{"id":"values-13","en":"I consider the effect of major choices on people close to me.","ta":"முக்கிய முடிவுகள் எனக்கு நெருக்கமானவர்களை எப்படி பாதிக்கும் என்று சிந்திப்பேன்.","facet":"family"},{"id":"values-14","en":"I prioritize financial or personal stability when choosing between options.","ta":"வாய்ப்புகளைத் தேர்ந்தெடுக்கும்போது பொருளாதார அல்லது தனிப்பட்ட நிலைத்தன்மைக்கு முன்னுரிமை தருவேன்.","facet":"security"},{"id":"values-15","en":"Independence matters to me even if it requires extra responsibility.","ta":"கூடுதல் பொறுப்பு வந்தாலும் சுயமாகச் செயல்படுவது எனக்கு முக்கியம்.","facet":"freedom"},{"id":"values-16","en":"I prefer work that has a positive effect beyond my own benefit.","ta":"எனக்கான பலனைத் தாண்டி நல்ல தாக்கம் தரும் பணியை விரும்புவேன்.","facet":"service"}]},{"id":"talents","en":"Potential Talents","ta":"வெளிப்படாத திறமை வாய்ப்புகள்","facets":[{"id":"communication","en":"Communication","ta":"தொடர்பாடல்"},{"id":"analytical","en":"Analytical thinking","ta":"பகுப்பாய்வுச் சிந்தனை"},{"id":"creative","en":"Creative expression","ta":"படைப்பாற்றல்"},{"id":"interpersonal","en":"Interpersonal support","ta":"மனித உறவுகள்"},{"id":"practical","en":"Practical problem-solving","ta":"நடைமுறைத் தீர்வுகள்"},{"id":"leadership","en":"Coordination & leadership","ta":"வழிநடத்தலும் ஒருங்கிணைப்பும்"}],"questions":[{"id":"talents-01","en":"Others have asked me to explain something because I made it understandable.","ta":"நான் எளிதாக விளக்குவதால் மற்றவர்கள் என்னிடம் விளக்கம் கேட்டிருக்கிறார்கள்.","facet":"communication"},{"id":"talents-02","en":"I have noticed a pattern or cause that others initially missed.","ta":"மற்றவர்கள் முதலில் கவனிக்காத ஒரு காரணத்தையோ ஒற்றுமையையோ நான் கண்டிருக்கிறேன்.","facet":"analytical"},{"id":"talents-03","en":"I have produced an original idea that someone found useful.","ta":"நான் சொன்ன புதிய யோசனை ஒருவருக்குப் பயனுள்ளதாக இருந்திருக்கிறது.","facet":"creative"},{"id":"talents-04","en":"People have approached me for support during difficult moments.","ta":"கடினமான நேரத்தில் ஆதரவு தேடி மற்றவர்கள் என்னை அணுகியிருக்கிறார்கள்.","facet":"interpersonal"},{"id":"talents-05","en":"I have figured out how to fix or improve a practical process.","ta":"ஒரு நடைமுறை வேலையைச் சரிசெய்யவோ மேம்படுத்தவோ வழி கண்டிருக்கிறேன்.","facet":"practical"},{"id":"talents-06","en":"I have helped a group coordinate tasks successfully.","ta":"ஒரு குழு வேலைகளைச் சிறப்பாக ஒருங்கிணைக்க உதவியிருக்கிறேன்.","facet":"leadership"},{"id":"talents-07","en":"I can often find a simpler way to explain a complicated point.","ta":"சிக்கலான கருத்தை எளிதாக விளக்கும் வழியை அடிக்கடி கண்டுபிடிப்பேன்.","facet":"communication"},{"id":"talents-08","en":"I can compare information and spot inconsistencies.","ta":"தகவல்களை ஒப்பிட்டு முரண்பாடுகளைக் கண்டுபிடிக்க முடியும்.","facet":"analytical"},{"id":"talents-09","en":"I can generate more than one approach to a creative challenge.","ta":"படைப்பாற்றல் தேவைப்படும் சவாலுக்கு ஒன்றுக்கும் மேற்பட்ட வழிகளை உருவாக்க முடியும்.","facet":"creative"},{"id":"talents-10","en":"I can usually make a new person feel included in a conversation.","ta":"புதியவர் உரையாடலில் இணைந்திருப்பதை உணரச் செய்ய முடியும்.","facet":"interpersonal"},{"id":"talents-11","en":"I learn some hands-on tasks relatively quickly when I practise.","ta":"சில நடைமுறை வேலைகளைப் பயிற்சி செய்தால் ஒப்பீட்டளவில் விரைவாகக் கற்றுக்கொள்கிறேன்.","facet":"practical"},{"id":"talents-12","en":"I can help people agree on who will do what in a shared task.","ta":"கூட்டு வேலையில் யார் என்ன செய்வது என்று ஒத்துக்கொள்ள உதவ முடியும்.","facet":"leadership"},{"id":"talents-13","en":"I have received specific positive feedback about how I communicate.","ta":"நான் தொடர்புகொள்ளும் விதம் குறித்து குறிப்பிட்ட பாராட்டு பெற்றிருக்கிறேன்.","facet":"communication"},{"id":"talents-14","en":"I have successfully used evidence to change an initial conclusion.","ta":"ஆதாரத்தைப் பயன்படுத்தி முதலில் எடுத்த முடிவைச் சரியாக மாற்றியிருக்கிறேன்.","facet":"analytical"},{"id":"talents-15","en":"I have adapted an existing idea into something more useful.","ta":"ஏற்கெனவே உள்ள யோசனையை மேலும் பயனுள்ளதாக மாற்றியிருக்கிறேன்.","facet":"creative"},{"id":"talents-16","en":"Someone has thanked me for understanding their point of view.","ta":"அவர்களின் நிலையைப் புரிந்துகொண்டதற்காக ஒருவர் எனக்கு நன்றி கூறியிருக்கிறார்.","facet":"interpersonal"},{"id":"talents-17","en":"I have learned a practical method and shown someone else how it works.","ta":"ஒரு நடைமுறை முறையைக் கற்று மற்றவருக்கும் செய்து காட்டியிருக்கிறேன்.","facet":"practical"},{"id":"talents-18","en":"I have taken responsibility for keeping a shared activity on track.","ta":"கூட்டு வேலை திட்டப்படி நடக்கப் பொறுப்பேற்றிருக்கிறேன்.","facet":"leadership"},{"id":"talents-19","en":"I can tailor an explanation to a child, peer or older adult.","ta":"குழந்தை, நண்பர், பெரியவர் என யாருக்குச் சொல்கிறேனோ அதற்கேற்ப விளக்கத்தை மாற்ற முடியும்.","facet":"communication"},{"id":"talents-20","en":"I have identified a useful improvement after observing how a task is done.","ta":"ஒரு வேலை நடைபெறுவதை கவனித்து பயனுள்ள முன்னேற்றத்தைச் சுட்டிக்காட்டியிருக்கிறேன்.","facet":"analytical"}]},{"id":"skills","en":"Practical Skills","ta":"நடைமுறைத் திறன்கள்","facets":[{"id":"communication","en":"Communication","ta":"தொடர்பாடல்"},{"id":"digital","en":"Digital literacy","ta":"டிஜிட்டல் பயன்பாடு"},{"id":"planning","en":"Planning","ta":"திட்டமிடல்"},{"id":"teamwork","en":"Teamwork","ta":"குழுவாகச் செயல்படுதல்"},{"id":"problem","en":"Problem-solving","ta":"சிக்கல் தீர்த்தல்"},{"id":"learning","en":"Learning skills","ta":"கற்றல் திறன்"}],"questions":[{"id":"skills-01","en":"I can explain an idea clearly to someone unfamiliar with it.","ta":"ஒரு கருத்தை அதைப் பற்றி அறியாதவருக்கும் தெளிவாக விளக்க முடியும்.","facet":"communication"},{"id":"skills-02","en":"I can use a smartphone or computer to find reliable information.","ta":"நம்பகமான தகவலைத் தேட கைப்பேசியையோ கணினியையோ பயன்படுத்த முடியும்.","facet":"digital"},{"id":"skills-03","en":"I can break a large task into smaller steps and set deadlines.","ta":"பெரிய வேலையைச் சிறிய படிகளாகப் பிரித்து காலக்கெடு நிர்ணயிக்க முடியும்.","facet":"planning"},{"id":"skills-04","en":"I can share tasks and communicate respectfully in a team.","ta":"குழுவில் பணிகளைப் பகிர்ந்து மரியாதையாகத் தொடர்புகொள்ள முடியும்.","facet":"teamwork"},{"id":"skills-05","en":"I can define a problem before trying to solve it.","ta":"ஒரு பிரச்சினைக்குத் தீர்வு காணும் முன் அதைத் தெளிவாக வரையறுக்க முடியும்.","facet":"problem"},{"id":"skills-06","en":"I can use practice and feedback to learn a new skill.","ta":"பயிற்சியும் கருத்துகளும் மூலம் புதிய திறனைக் கற்றுக்கொள்ள முடியும்.","facet":"learning"},{"id":"skills-07","en":"I can write a clear message explaining a request or decision.","ta":"ஒரு கோரிக்கையையோ முடிவையோ தெளிவாக எழுத முடியும்.","facet":"communication"},{"id":"skills-08","en":"I can organize digital files and protect important passwords.","ta":"டிஜிட்டல் கோப்புகளை ஒழுங்குபடுத்தவும் கடவுச்சொற்களைப் பாதுகாக்கவும் முடியும்.","facet":"digital"},{"id":"skills-09","en":"I can estimate how long a task will take and plan accordingly.","ta":"ஒரு வேலைக்கு எவ்வளவு நேரம் தேவை என்று கணித்து திட்டமிட முடியும்.","facet":"planning"},{"id":"skills-10","en":"I can listen to a colleague and clarify misunderstandings.","ta":"சக பணியாளர் சொல்வதைக் கேட்டு தவறான புரிதலைச் சரிசெய்ய முடியும்.","facet":"teamwork"},{"id":"skills-11","en":"I can compare possible solutions using practical criteria.","ta":"நடைமுறை அளவுகோல்களால் பல தீர்வுகளை ஒப்பிட முடியும்.","facet":"problem"},{"id":"skills-12","en":"I can explain what I learned after completing a task.","ta":"ஒரு வேலையை முடித்த பிறகு கற்றதை விளக்க முடியும்.","facet":"learning"},{"id":"skills-13","en":"I can ask relevant questions when instructions are unclear.","ta":"வழிமுறைகள் தெளிவில்லாதபோது பொருத்தமான கேள்விகள் கேட்க முடியும்.","facet":"communication"},{"id":"skills-14","en":"I can recognize suspicious links or requests for personal data.","ta":"சந்தேகமான இணைப்புகளையும் தனிப்பட்ட தகவல் கேட்கும் முயற்சிகளையும் அறிய முடியும்.","facet":"digital"},{"id":"skills-15","en":"I can monitor progress and adjust a schedule when needed.","ta":"முன்னேற்றத்தைக் கண்காணித்து தேவைப்பட்டால் அட்டவணையை மாற்ற முடியும்.","facet":"planning"},{"id":"skills-16","en":"I can contribute constructively when team members disagree.","ta":"குழுவில் கருத்து வேறுபாடு ஏற்பட்டால் பயனுள்ள வகையில் பங்களிக்க முடியும்.","facet":"teamwork"},{"id":"skills-17","en":"I can test a small solution before using it widely.","ta":"ஒரு தீர்வை பரவலாகப் பயன்படுத்தும் முன் சிறிய அளவில் சோதிக்க முடியும்.","facet":"problem"},{"id":"skills-18","en":"I can find a suitable learning resource and practise independently.","ta":"பொருத்தமான கற்றல் வளத்தைத் தேர்ந்தெடுத்து தனியாகப் பயிற்சி செய்ய முடியும்.","facet":"learning"},{"id":"skills-19","en":"I can summarize important points from a discussion.","ta":"உரையாடலின் முக்கிய கருத்துகளைச் சுருக்கமாகச் சொல்ல முடியும்.","facet":"communication"},{"id":"skills-20","en":"I can use basic digital tools to complete everyday tasks.","ta":"அன்றாட வேலைகளுக்கு அடிப்படை டிஜிட்டல் கருவிகளைப் பயன்படுத்த முடியும்.","facet":"digital"}]},{"id":"growth","en":"Growth Opportunities","ta":"வளர்ச்சிக்கான வாய்ப்புகள்","facets":[{"id":"feedback","en":"Using feedback","ta":"கருத்துகளைப் பயன்படுத்துதல்"},{"id":"habits","en":"Consistent habits","ta":"தொடர்ச்சியான பழக்கங்கள்"},{"id":"resources","en":"Access to resources","ta":"வளங்களைப் பயன்படுத்துதல்"},{"id":"confidence","en":"Trying new things","ta":"புதிய முயற்சிகள்"}],"questions":[{"id":"growth-01","en":"I ask for specific feedback after trying something new.","ta":"புதிய முயற்சிக்குப் பிறகு குறிப்பிட்ட கருத்துகளைக் கேட்பேன்.","facet":"feedback"},{"id":"growth-02","en":"I can reserve a small regular time for a goal that matters to me.","ta":"முக்கியமான இலக்குக்காகத் தினமும் சிறிது நேரம் ஒதுக்க முடியும்.","facet":"habits"},{"id":"growth-03","en":"I know where to seek affordable or free learning support.","ta":"இலவசமாகவோ குறைந்த செலவிலோ கற்றல் உதவி எங்கே கிடைக்கும் என்று எனக்குத் தெரியும்.","facet":"resources"},{"id":"growth-04","en":"I am willing to try an unfamiliar activity on a small scale.","ta":"அறிமுகமில்லாத செயலைச் சிறிய அளவில் முயற்சிக்கத் தயாராக இருக்கிறேன்.","facet":"confidence"},{"id":"growth-05","en":"I use constructive criticism to decide what to practise next.","ta":"பயனுள்ள விமர்சனத்தின் அடிப்படையில் அடுத்து என்ன பயிற்சி செய்வது என்று முடிவெடுப்பேன்.","facet":"feedback"},{"id":"growth-06","en":"I track whether I completed a small weekly commitment.","ta":"வாராந்திர சிறிய இலக்கை முடித்தேனா என்று கண்காணிப்பேன்.","facet":"habits"},{"id":"growth-07","en":"I can identify a person or resource that could help me improve.","ta":"என் முன்னேற்றத்திற்கு உதவும் நபரையோ வளத்தையோ அடையாளம் காண முடியும்.","facet":"resources"},{"id":"growth-08","en":"I can tolerate being a beginner while learning something new.","ta":"புதியதைக் கற்கும்போது தொடக்கநிலையில் இருப்பதை ஏற்றுக்கொள்ள முடியும்.","facet":"confidence"},{"id":"growth-09","en":"I can describe one useful change after receiving feedback.","ta":"கருத்து பெற்ற பிறகு செய்ய வேண்டிய ஒரு மாற்றத்தைச் சொல்ல முடியும்.","facet":"feedback"},{"id":"growth-10","en":"I return to a useful routine after missing a day.","ta":"ஒரு நாள் தவறினாலும் பயனுள்ள பழக்கத்தை மீண்டும் தொடர்வேன்.","facet":"habits"},{"id":"growth-11","en":"I can make progress using resources already available to me.","ta":"என்னிடம் உள்ள வளங்களைப் பயன்படுத்தியே முன்னேற முடியும்.","facet":"resources"},{"id":"growth-12","en":"I am prepared to test a new interest before judging my ability.","ta":"என் திறனை முடிவு செய்வதற்கு முன் புதிய ஆர்வத்தைச் சோதிக்கத் தயாராக இருக்கிறேன்.","facet":"confidence"}]}];const KEY='SD360_V3_LOCAL_';let lang=localStorage.getItem(KEY+'lang')||'ta',profile=JSON.parse(localStorage.getItem(KEY+'profile')||'null'),answers=JSON.parse(localStorage.getItem(KEY+'answers')||'{}'),view='home',current=null,idx=0;const $=x=>document.getElementById(x),L=(ta,en)=>lang==='ta'?ta:en,txt=o=>o[lang],dual=o=>esc(txt(o))+(lang==='ta'&&o.en?`<span class="english-help" lang="en">${esc(o.en)}</span>`:''),save=()=>localStorage.setItem(KEY+'answers',JSON.stringify(answers));f utton class="secondary" onclick="go('combined')">${L('ஒருங்கிணைந்த அறிக்கை','Integrated report')}</button><button class="secondary" onclick="switchLang()">${lang==='ta'?'English':'தமிழ்'}</button><button class="secondary" onclick="go('privacy')">${L('தனியுரிமை','Privacy')}</button></nav>`}function frame(s){$('app').innerHTML=header()+`<main>${nav()}${s}</main><footer>${L('இது சுயபரிசோதனைக்கான கருவி; உறுதிப்படுத்தப்பட்ட உளவியல் பரிசோதனை அல்ல.','An exploratory self-report tool, not a validated psychological test.')}</footer>`}function go(v,id){view=v;if(id)current=id;render();window.scrollTo(0,0)}function switchLang(){lang=lang==='ta'?'en':'ta';localStorage.setItem(KEY+'lang',lang);render()}function register(){let n=$('name').value.trim(),a=$('age').value,c=$('consent').checked;if(!n||!a||!c){alert(L('பெயர், வயது மற்றும் ஒப்புதல் தேவை.','Name, age range and consent are required.'));return}profile={name:n,age:a,consentAt:new Date().toISOString()};localStorage.setItem(KEY+'profile',JSON.stringify(profile));go('home')}function home(){if(!profile)return frame(`<section class="card"><h2>${L('உங்கள் சுயஅறிதல் பயணத்தைத் தொடங்குங்கள்','Start your self-discovery journey')}</h2><p class="muted">${L('7 தனித்தனி அமர்வுகள் · 120 கேள்விகள் · விரும்பிய வரிசையில் முடிக்கலாம்.','7 independent sessions · 120 questions · Any order.')}</p><label>${L('பெயர்','Name')}<input id="name" maxlength="90" autocomplete="name"></label><label>${L('வயது வரம்பு','Age range')}<select id="age"><option value="">${L('தேர்ந்தெடுக்கவும்','Select')}</option><option>18–24</option><option>25–34</option><option>35–44</option><option>45–54</option><option>55+</option></select></label><label><input id="consent" type="checkbox" style="width:auto"> ${L('என் பதில்கள் இந்த உலாவியில் மட்டும் சேமிக்கப்படுவதற்கு ஒப்புக்கொள்கிறேன்.','I consent to my answers being stored only in this browser.')}</label><p class="muted">${L('உலாவித் தகவலை நீக்கினால் பதில்கள் அழியலாம். பிறருடன் பகிரும் சாதனத்தில் பயன்படுத்த வேண்டாம்.','Clearing browser data may erase answers. Avoid shared devices.')}</p><button onclick="register()">${L('தொடங்குங்கள்','Begin')}</button></section>`);let completed=DATA.filter(done).length;frame(`<section class="card"><h2>${L('வணக்கம்','Welcome')}, ${esc(profile.name)}</h2><div class="flex"><span>${completed}/7 ${L('அமர்வுகள் முடிந்தன','sessions complete')}</span><span>${DATA.reduce((n,d)=>n+count(d),0)}/120</span></div><div class="progress"><div style="width:${DATA.reduce((n,d)=>n+count(d),0)/120*100}%"></div></div><p class="muted">${L('எந்த அமர்வையும் தேர்ந்தெடுக்கலாம். பதில்கள் இந்த உலாவியில் தானாகச் சேமிக்கப்படும்.','Choose any session. Answers save automatically in this browser.')}</p></section><div class="grid">${DATA.map((d,i)=>`<section class="card"><span class="tag">${L('அமர்வு','Session')} ${i+1}</span><h2>${dual(d)}</h2><p>${count(d)}/${d.questions.length} ${L('பதில்கள்','answers')}</p><div class="progress"><div style="width:${count(d)/d.questions.length*100}%"></div></div><nav><button onclick="start('${d.id}')">${done(d)?L('மீண்டும் பார்க்க','Review'):count(d)?L('தொடருங்கள்','Resume'):L('தொடங்குங்கள்','Start')}</button>${done(d)?`<button class="secondary" onclick="go('report','${d.id}')">${L('அறிக்கை','Report')}</button>`:''}</nav></section>`).join('')}</div><section class="card"><h2>${L('ஒருங்கிணைந்த சுயஅறிதல் அறிக்கை','Integrated discovery report')}</h2><p>${completed===7?L('அனைத்து அமர்வுகளும் முடிந்தன.','All sessions are complete.'):L('ஏழு அமர்வுகளையும் முடித்த பிறகு கிடைக்கும்.','Available after completing all seven sessions.')}</p><button ${completed===7?'':'disabled'} onclick="go('combined')">${L('அறிக்கையைப் பார்க்க','View report')}</button></section>`)}function start(id){current=id;let d=DATA.find(d=>d.id===id);idx=Math.max(0,d.questions.findIndex(q=>answers[q.id]==null));if(idx<0)idx=0;go('question')}function answer(v){let d=DATA.find(d=>d.id===current);answers[d.questions[idx].id]=Number(v);save();render()}function move(delta){let d=DATA.find(d=>d.i `This is an original, exploratory, not-yet-validated self-report questionnaire. Subscales have few items. Do not infer verified talent, ability, aptitude, percentile ranks or fixed personality from these numbers. Do not average unrelated constructs into a single score.\n\nCreate a detailed report with: (1) executive summary and three emerging patterns; (2) separate analysis of interests, strengths, passion/motivation, values, potential talents, skills and growth opportunities; (3) cross-domain alignments, tensions and alternative interpretations; (4) five possible career, volunteering or personal project directions to explore, each with rationale, missing evidence and a low-cost experiment; (5) three prioritized development goals and measurable 30/60/90-day plans with weekly activities; (6) five practical evidence-gathering exercises and feedback questions; (7) one action within 24 hours; (8) limitations and when to consult a qualified career professional.\n\nDo not invent my age, education, job history, circumstances, aspirations or personal examples. Ask up to five targeted follow-up questions if needed for meaningful recommendations. Without that information, label directions as tentative. No clinical diagnosis or guarantees of career success.`);

function aiPanel(){const prompt=aiPrompt();return `<section class="card no-print" id="ai-prompt-panel"><h2>${L('ChatGPT மூலம் விரிவான சுயஅறிதல் அறிக்கை','Detailed self-discovery report with ChatGPT')}</h2><p>${L('உங்கள் ஏழு அமர்வுகளின் உண்மையான மதிப்பெண்கள் மற்றும் துணைப்பிரிவு மதிப்பெண்களுடன் தனிப்பட்ட prompt தயாராக உள்ளது.','A personalized prompt is ready with your actual scores and subscale indicators from all seven sessions.')}</p><p class="muted">${L('பாதுகாப்புக்காக உங்கள் பெயர், வயது, மின்னஞ்சல் மற்றும் தனிப்பட்ட பதில்கள் இதில் சேர்க்கப்படவில்லை. ChatGPT-க்கு ஒட்டுவதற்கு முன் உள்ளடக்கத்தைச் சரிபார்க்கவும்.','For privacy, your name, age, email and individual answers are excluded. Review the content before sharing it with ChatGPT.')}</p><label for="aiPromptText"><b>${L('உங்கள் தனிப்பட்ட prompt','Your personalized prompt')}</b></label><textarea id="aiPromptText" rows="11" spellcheck="false" aria-label="Personalized ChatGPT prompt">${esc(prompt)}</textarea><label><input type="checkbox" id="aiConsent" style="width:auto;margin-right:8px">${L('இந்தத் தகவலை வெளிப்புற AI சேவையுடன் பகிர்வதை நான் புரிந்துகொண்டேன்.','I understand that pasting this information into ChatGPT shares it with an external AI service.')}</label><nav><button onclick="copyAiPrompt()">${L('Prompt நகலெடுக்கவும்','Copy personalized prompt')}</button><button class="secondary" onclick="downloadAiPrompt()">${L('Prompt TXT பதிவிறக்கம்','Download prompt TXT')}</button></nav><p id="aiStatus" role="status" class="muted"></p><p class="muted">${L('இந்தப் பொத்தான் ChatGPT-க்கு தானாகத் தகவல் அனுப்பாது. நீங்கள் விரும்பினால் மட்டும் ஒட்டலாம்.','No data is automatically sent to ChatGPT. Sharing is your choice.')}</p></section>`}
function aiApproved(){if(!$('aiConsent')?.checked){$('aiStatus').textContent=L('முதலில் தகவல் பகிர்வைப் புரிந்துகொண்டதை உறுதிப்படுத்துங்கள்.','Please confirm that you understand external sharing.');return false}return true}
async function copyAiPrompt(){if(!aiApproved())return;const t=$('aiPromptText').value;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(t)}else{$('aiPromptText').focus();$('aiPromptText').select();if(!document.execCommand('copy'))throw Error('copy unavailable')} $('aiStatus').textContent=L('நகலெடுக்கப்பட்டது. ChatGPT-இல் ஒட்டலாம்.','Copied. You can paste it into ChatGPT.')}catch(e){$('aiStatus').textContent=L('தானாக நகலெடுக்க முடியவில்லை. உரையைத் தேர்ந்தெடுத்து நகலெடுக்கவும்.','Automatic copy unavailable. Select and copy the text manually.')}}
function downloadAiPrompt(){if(!aiApproved())return;const blob=new Blob([$('aiPromptText').value],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='SD360_Personalized_ChatGPT_Prompt.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('aiStatus').textContent=L('Prompt பதிவிறக்கப்பட்டது.','Prompt download started.')}
function integrated(){if(!DATA.every(done))return frame(`<section class="card"><h2>${L('முழு அறிக்கை இன்னும் தயாராகவில்லை','Integrated report not ready')}</h2><p>${L('அனைத்து ஏழு அமர்வுகளையும் முடிக்கவும்.','Complete all seven sessions.')}</p><button onclick="go('home')">${L('முகப்பு','Home')}</button></section>`);let summary=DATA.map(d=>({d,fs:facets(d).sort((a,b)=>b.score-a.score)}));let top=summary.map(x=>({domain:txt(x.d),facet:txt(x.fs[0]),facetEn:x.fs[0].en,score:x.fs[0].score}));let b=`<h2>${L('ஒருங்கிணைந்த சுயஅறிதல் மற்றும் வளர்ச்சி அறிக்கை','Integrated Self-Discovery & Development Report')}</h2><p>${esc(profile.name)} · ${new Date().toLocaleDateString()}</p><p>${L('இவை உங்கள் சுயவிவரப் பதில்களின் அடிப்படையில் கிடைத்த ஆராய்வு குறிப்புகள். தனிப்பட்ட தகுதி அல்லது தொழில் பொருத்தத்தை நிரூபிப்பவை அல்ல.','These are exploratory patterns from your self-reports, not proof of ability or career fit.')}</p><h3>${L('ஏழு துறைகளின் முக்கிய குறியீடுகள்','Top indicator in each domain')}</h3>${top.map(x=>`<div class="stat"><b>${esc(x.domain)}</b><p>${esc(x.facet)}${lang==='ta'?` <span class="english-inline">(${esc(x.facetEn)})</span>`:''} · ${x.score}/100</p></div>`).join('')}<h3>${L('ஒருங்கிணைந்த பார்வை','Cross-domain exploration')}</h3><p>${L('உங்கள் ஆர்வம், உந்துதல், மதிப்புகள், திறன் அனுபவம் ஆகியவை ஒரே திசையில் இருக்கிறதா என்பதைச் சோதிக்கவும். வேறுபட்டால் அது குறை அல்ல; புதிய முயற்சிக்கான தகவல்.','Compare your interests, motivation, values and demonstrated experience. Differences are useful clues, not deficits.')}</p><h3>${L('30 / 60 / 90 நாள் திட்டம்','30 / 60 / 90-day plan')}</h3><ol><li>${L('30 நாட்கள்: விருப்பமான இரண்டு செயல்களைச் சிறிய அளவில் முயன்று அனுபவத்தைப் பதிவு செய்யுங்கள்.','30 days: Try two interesting activities on a small scale and record the experience.')}</li><li>${L('60 நாட்கள்: ஒரு திறனைத் தேர்ந்தெடுத்து வாரந்தோறும் பயிற்சி செய்து பிறரின் கருத்தைப் பெறுங்கள்.','60 days: Practise one selected skill weekly and request feedback.')}</li><li>${L('90 நாட்கள்: ஒரு சிறிய திட்டத்தை முடித்து முன்னேற்ற ஆதாரத்துடன் மீளாய்வு செய்யுங்கள்.','90 days: Complete a small project and review progress using evidence.')}</li></ol><h3>${L('தனிப்பட்ட பரிந்துரைகள்','Domain-specific suggestions')}</h3>${summary.map(x=>`<p><b>${esc(txt(x.d))}:</b> ${esc(suggestions[x.d.id][lang==='ta'?1:0])}</p>`).join('')}<h3>${L('ஆதாரச் சரிபார்ப்பு','Evidence check')}</h3><p>${L('ஒவ்வொரு முக்கிய முடிவுக்கும் ஒரு உண்மையான உதாரணம், மற்றவரின் குறிப்பிட்ட கருத்து, மற்றும் ஒரு நடைமுறை முயற்சி ஆகியவற்றைச் சேர்க்கவும்.','For each important conclusion, gather a real example, specific feedback from another person and a practical demonstration.')}</p><h3>${L('வரம்புகள்','Limitations')}</h3><p>${L('இந்த கேள்வித்தாள் புதியதாக உருவாக்கப்பட்டது; நம்பகத்தன்மை, மொழி ஒப்புமை, அளவீட்டு செல்லுபடித்தன்மை இன்னும் ஆய்வு செய்யப்படவில்லை. மதிப்பெண்கள் சுய அறிக்கையை மட்டுமே காட்டுகின்றன.','This original questionnaire has not yet been psychometrically validated for reliability, language equivalence or predictive validity. Scores reflect self-report only.')}</p>`;b+=`<h3>${L('ChatGPT விரிவான அறிக்கை Prompt','ChatGPT Detailed Report Prompt')}</h3><p>${L('கீழே உங்கள் மதிப்பெண்களைக் கொண்டு உருவாக்கப்பட்ட prompt உள்ளது. பகிர்வதற்கு முன் சரிபார்க்கவும்.','This prompt uses your scores. Review before sharing.')}</p><pre style="white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;background:#f2f5fa;padding:14px;border-radius:9px">${esc(aiPrompt())}</pre>`;frame(`<section class="card" id="report">${b}</section>${aiPanel()}<nav class="no-print"><button onclick="download('SD360_Integrated_Report',document.getElementById('report').innerHTML)">${L('முழு HTML அறிக்கையைப் பதிவிறக்குங்கள்','Download integrated HTML')}</button><button class="secondary" onclick="window.print()">${L('PDF ஆக சேமிக்க','Print / Save PDF')}</button></nav>`)}function privacy(){frame(`<section class="card"><h2>${L('தனியுரிமை மற்றும் வரம்புகள்','Privacy & limitations')}</h2><p>${L('இது ஆஃப்லைன் சோதனைப் பதிப்பு. பெயர், வயது வரம்பு, பதில்கள் அனைத்தும் இந்த உலாவியின் localStorage-இல் மட்டும் இருக்கும்; இணையச் சேவையகத்துக்கு அனுப்பப்படாது.','This offline preview stores name, age range and answers only in this browser’s localStorage. It does not send them to a server.')}</p><p>${L('பகிரப்படும் சாதனங்களில் பயன்படுத்த வேண்டாம். உலாவித் தகவலை நீக்கினால் முன்னேற்றம் அழியும்.','Avoid shared devices. Clearing browser storage will erase progress.')}</p><p>${L('இது உறுதிப்படுத்தப்பட்ட உளவியல், தொழில் தேர்வு அல்லது திறன் சோதனை அல்ல.','This is not a validated psychological, hiring or ability test.')}</p><button onclick="erase()" style="background:#9e3030">${L('இந்தச் சாதனத்தில் உள்ள எல்லா தகவல்களையும் நீக்குங்கள்','Delete all local assessment data')}</button></section>`)}function erase(){if(!confirm(L('எல்லா பதில்களையும் நீக்கவா?','Delete all local answers and profile?')))return;Object.keys(localStorage).filter(k=>k.startsWith(KEY)).forEach(k=>localStorage.removeItem(k));profile=null;answers={};go('home')}function render(){if(view==='home')home();else if(view==='question')question();else if(view==='report')report();else if(view==='combined')integrated();else if(view==='privacy')privacy()}render();</script></body></html>
